name: Docker Build and Push

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datascubesolutions/data-scube-be

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb+srv://nikul:nikul@datascube.7fholtw.mongodb.net/datascube_test?retryWrites=true&w=majority&appName=dataScube
          JWT_SECRET: test-secret-for-ci
          JWT_EXPIRES_IN: 24h
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: apptestnodemailer730@gmail.com
          SMTP_PASS: uajw muti dajb voyc
          MAIL_USER: apptestnodemailer730@gmail.com
          MAIL_PASS: uajw muti dajb voyc
          FROM_EMAIL: apptestnodemailer730@gmail.com
          LOG_LEVEL: error
          RATE_LIMIT_WINDOW_MS: 900000
          RATE_LIMIT_MAX_REQUESTS: 100
          BCRYPT_ROUNDS: 12

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image built successfully
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "📦 You can now deploy this image to your server"
